<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "GT Flexa VF", "GTFlexaVF-Bold", system-ui, sans-serif;
    }

    .screen {
      width: 390px;
      height: 844px;
      background: #fff;
      display: none;
      flex-direction: column;
      overflow: hidden;
      border-radius: 40px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.15);
    }
    .screen.active { display: flex; }

    /* Status bar */
    .status-bar {
      display: flex;
      align-items: center;
      padding: 21px 24px 19px;
      gap: 0;
    }
    .status-time {
      flex: 1;
      font-size: 17px;
      font-weight: 600;
      font-family: system-ui, sans-serif;
      text-align: center;
      color: #000;
    }
    .status-icons {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    /* ── LOGIN ── */
    .login-hero {
      padding: 64px 32px 48px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .login-title {
      font-size: 36px;
      font-weight: 700;
      color: #111;
      letter-spacing: -0.03em;
      line-height: 40px;
    }
    .login-subtitle {
      font-size: 16px;
      font-weight: 900;
      color: #888;
      line-height: 24px;
    }

    .login-form {
      padding: 0 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field-label {
      font-size: 12px;
      font-weight: 700;
      color: #111;
      letter-spacing: 0.08em;
      line-height: 16px;
    }
    .field-input {
      border: 1.5px solid #eee;
      border-radius: 10px;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 16px;
      color: #888;
      line-height: 24px;
      outline: none;
      transition: border-color 0.15s;
    }
    .field-input:focus { border-color: #3B3BEF; color: #111; }
    .field-input::placeholder { color: #aaa; }

    .forgot {
      font-size: 14px;
      font-weight: 700;
      color: #3B3BEF;
      text-align: right;
      line-height: 20px;
      cursor: pointer;
      text-decoration: none;
    }

    .login-cta {
      padding: 32px 32px 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .btn-primary {
      background: #3B3BEF;
      border: none;
      border-radius: 12px;
      padding: 17px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      text-align: center;
      letter-spacing: -0.01em;
      line-height: 22px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-primary:hover:not(:disabled) { opacity: 0.88; }
    .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }

    .signup-link {
      font-size: 14px;
      color: #888;
      text-align: center;
      line-height: 20px;
    }
    .signup-link a {
      color: #3B3BEF;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    /* ── HOME ── */
    .home-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px 12px;
      border-bottom: 1.5px solid #eee;
    }
    .home-nav-title {
      font-size: 22px;
      font-weight: 700;
      color: #111;
      letter-spacing: -0.03em;
      line-height: 28px;
      white-space: nowrap;
    }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #3B3BEF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 32px;
    }
    .empty-title {
      font-size: 17px;
      font-weight: 700;
      color: #111;
      letter-spacing: -0.01em;
      line-height: 24px;
    }
    .empty-body {
      font-size: 14px;
      color: #888;
      text-align: center;
      line-height: 20px;
    }
  </style>
</head>

        </svg>
      </div>
    </div>

    <div class="login-hero">
      <div class="login-title">Welcome back.</div>
      <div class="login-subtitle">Sign in to continue</div>
    </div>

    <div class="login-form">
      <div class="field">
        <div class="field-label">EMAIL</div>
        <input class="field-input" id="email" type="email" placeholder="you@example.com" oninput="checkFields()" />
      </div>
      <div class="field">
        <div class="field-label">PASSWORD</div>
        <input class="field-input" id="password" type="password" placeholder="••••••••" oninput="checkFields()" />
      </div>
      <a class="forgot">Forgot password?</a>
    </div>

    <div class="login-cta">
      <button class="btn-primary" id="sign-in-btn" onclick="navigate('home')" disabled>Sign In</button>
      <div class="signup-link">Don't have an account? <a>Sign up</a></div>
    </div>
  </div>

  <!-- HOME SCREEN -->

  <script>
    function checkFields() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      document.getElementById('sign-in-btn').disabled = !(email && password);
    }

    function navigate(screen) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-' + screen).classList.add('active');
    }
  </script>
</body>
</html>
